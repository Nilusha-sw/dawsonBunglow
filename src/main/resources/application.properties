spring.application.name=Dawson_Bungalow
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=DawsonBungalowDB

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Base URL - CRITICAL for image URLs
app.base-url=http://newdawson-production.up.railway.app

# GridFS / Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# Pinecone
pinecone.api-key=${PINECONE_API_KEY}
pinecone.index=dawsonbungalow
pinecone.index-url=https://dawsonbungalow-3nq03gf.svc.aped-4627-b74a.pinecone.io

# Groq

groq.api.key=${GROQ_API_KEY}
groq.model=llama-3.3-70b-versatile
